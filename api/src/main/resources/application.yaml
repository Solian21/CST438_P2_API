spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: api
  mvc:
    problemdetails:
      enabled: true
  datasource:
      url: ${DATABASE_URL}
      username: ${DB_USER}
      password: ${DB_PASS}
      driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
    show-sql: true