spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: api
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          audiences: ${GOOGLE_CLIENT_ID}
  datasource:
      url: ${DATABASE_URL}
      username: ${DB_USER}
      password: ${DB_PASS}
      driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
    show-sql: true
  data:
    web:
      pageable:
        serialization-mode: via_dto