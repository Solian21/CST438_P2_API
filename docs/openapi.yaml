# Starter OpenAPI contract for CST 438 Project 02.
# Copy to docs/openapi.yaml in your repo, then replace Workout/Exercise with YOUR resources.
# Render it:   https://editor.swagger.io  (File > Import file, or paste)
# Lint it:     npx @redocly/cli lint docs/openapi.yaml
# Mock it:     npx @stoplight/prism-cli mock docs/openapi.yaml   -> http://127.0.0.1:4010
openapi: 3.0.3

info:
  title: Recipe and Meal Tracker API
  version: 1.0.0
  description: API for creating recipes and planning meals
    Example contract for a recipe tracker. Users log meals made of recipes.
    Every error uses RFC 9457 Problem Details (see components/schemas/Problem).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Team 03
    url: https://github.com/Solian21/CST438_P2_API

servers:
  - url: http://localhost:8080
    description: Local (docker compose up)
  - url: https://recipe-api.example.com
    description: Production (replace in Sprint 3)

# Every endpoint requires a Bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Recipes
    description: The shared recipe catalog
  - name: Ingredients
    description: The shared ingredient catalog
  - name: Users
    description: The signed-in user's own account
  - name: Admin
    description: Admin-only user management

paths:
  /api/v1/recipes:
    get:
      tags: [Recipes]
      operationId: listRecipes
      summary: Lists available recipes (paginated, sortable)
      parameters:
        - name: mealplan
          in: query
          description: Lists recipes in the specific mealplan
          schema:
            $ref: '#/components/schemas/Mealplan'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Field and direction, Spring Pageable style.
          schema:
            type: string
            enum: ['performedOn,desc', 'performedOn,asc']
            default: 'performedOn,desc'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: One page of recipes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Recipes]
      operationId: createRecipe
      summary: Log a Recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Created. POST is not idempotent; two calls make two recipes.
          headers:
            Location:
              description: URL of the new recipe
              schema:
                type: string
                example: /api/v1/recipes/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/recipes/{recipeId}:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      tags: [Recipes]
      operationId: getRecipe
      summary: Get one of the recipes
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: The workout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Recipes]
      operationId: replaceRecipe
      summary: Replace a recipe (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The replaced recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Recipes]
      operationId: updateRecipe
      summary: Change some fields of a recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipePatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Recipes]
      operationId: deleteRecipe
      summary: Delete a recipe
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '204':
          description: Deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/ingredients:
    get:
      tags: [Ingredients]
      operationId: listIngredients
      summary: Browse the available ingredients (public, filterable)
      security: []          # public: no token needed
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: One page of ingredients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Ingredients]
      operationId: createIngredient
      summary: Add an ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Created. POST is not idempotent; two calls make two ingredients.
          headers:
            Location:
              description: URL of the new ingredient
              schema:
                type: string
                example: /api/v1/ingredients/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me:
    delete:
      tags: [Users]
      operationId: deleteMyAccount
      summary: Delete my own account and ALL my data
      description: Any signed-in user. Deletes the user row and everything they own (custom recipes, mealplans).
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted. The token is now useless.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List all users (admin only)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 7
    get:
      tags: [Admin]
      operationId: getUser
      summary: View one user (admin only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      operationId: updateUserRole
      summary: Grant or revoke admin (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Delete a user and all their data (admin only)
      description: Requires the ADMIN role. A USER token gets 403.
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the OAuth2 Authorization Code + PKCE flow (with Google, send the ID token; Google's access_token is opaque).

  parameters:
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 42
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Mealplan:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 67
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'

    Recipe:
      type: object
      required: [id, ingredients, measurements, instructions]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 42
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        measurements:
          type: string
          nullable: true
          example: ½ cup
        instructions:
          type: string
          nullable: true
          example: Instructions for a recipe

    RecipeCreate:
      description: Body for POST and PUT. PUT replaces every field.
      type: object
      required: [ingredients, measurements, instructions]
      properties:
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        measurements:
          type: string
          nullable: true
          example: ½ cup
        instructions:
          type: string
          nullable: true
          example: Instructions for a recipe

    IngredientCreate:
      description: Body for POST and PUT. PUT replaces every field.
      type: object
      required: [ingredientName]
      properties:
        ingredientName:
          type: string
          nullable: true
          example: Brown Sugar

    RecipePatch:
      description: Body for PATCH. Send only the fields you want to change.
      type: object
      minProperties: 1
      properties:
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        measurements:
          type: string
          nullable: true
          example: ½ cup
        instructions:
          type: string
          nullable: true
          example: Instructions for a recipe

    Ingredient:
      type: object
      required: [id, ingredientName]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 67
        ingredientName:
          type: string
          nullable: true
          example: Apple Slices

    PageMeta:
      description: >-
        Spring Data's PagedModel shape. Turn it on with
        spring.data.web.pageable.serialization-mode=via_dto in application.properties.
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3

    RecipePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'
        page:
          $ref: '#/components/schemas/PageMeta'

    IngredientsPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        page:
          $ref: '#/components/schemas/PageMeta'

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        email:
          type: string
          format: email
          example: sam@csumb.edu
        displayName:
          type: string
          example: Sam Otter
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      enum: [USER, ADMIN]

    UserPatch:
      description: Body for PATCH /api/v1/users/{userId}. Today the only editable field is the role.
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'

    Problem:
      description: RFC 9457 Problem Details. The ONE error body every endpoint returns.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Recipe 42 not found
        instance:
          type: string
          example: /api/v1/recipe/42

  responses:
    BadRequest:
      description: Validation failed or malformed JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: One or more fields failed validation. Check the request against the contract.
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
    Forbidden:
      description: Valid token, but not allowed (for example, not an admin)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
    NotFound:
      description: Doesn't exist, or belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Workout 42 not found
    InternalError:
      description: Unexpected server error. Your app still needs to show something useful.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500

